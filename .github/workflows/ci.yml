name: CI

on:
  push:
    branches: [main]
    tags: ["m*-*", "v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0 # upstream publishes no floating major tag
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy src

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0 # upstream publishes no floating major tag
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: pytest (unit) + coverage
        run: >-
          uv run pytest tests/unit
          --cov --cov-report=term-missing --cov-report=xml
          | tee pytest-output.txt
        shell: bash -o pipefail {0}
      - name: Coverage summary
        if: always()
        run: |
          echo '### Coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E '^(Name|TOTAL|src/)' pytest-output.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage.xml

  eval-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0 # upstream publishes no floating major tag
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Fake eval gate (fixture corpora; fails on regression or Leakage > 0)
        run: uv run pytest tests/unit/eval/test_eval_gate.py -v

  integration:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.19.2
        ports: ["6333:6333"]
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/ci-password
        ports: ["7687:7687"]
        options: >-
          --health-cmd "cypher-shell -u neo4j -p ci-password 'RETURN 1'"
          --health-interval 10s --health-timeout 10s --health-retries 12
    env:
      NEO4J_PASSWORD: ci-password
      DOCSEEK_NEO4J_WIPE_OK: "1" # throwaway service container
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0 # upstream publishes no floating major tag
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: pytest (integration)
        run: uv run pytest -m integration tests/integration -v

  docker-demo:
    # Clean checkout -> docker compose up -> quick demo answers /health, /search and the UI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: docker compose up (qdrant, api, ui)
        run: docker compose up -d --build --wait --wait-timeout 600 qdrant api ui
      - name: smoke test
        run: |
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS -X POST http://127.0.0.1:8000/search -H "Content-Type: application/json" \
            -H "X-Principal: anonymous" -d '{"query": "BackgroundTasks", "k": 3}' | tee search.json
          grep -q '"section_id"' search.json
          curl -fsS --retry 30 --retry-all-errors --retry-delay 2 -o /dev/null http://127.0.0.1:8501/
      - name: logs on failure
        if: failure()
        run: docker compose logs --tail 200 api ui
      - if: always()
        run: docker compose down -v
