# Model names live here, never in code (CLAUDE.md). Names use LiteLLM's "<provider>/<model>".
# The judge must come from a different provider family than the generator to reduce
# self-preference bias (PROJECT_SPEC §2, §5.4); the loader enforces this.
# Budget-driven choice (ADR 0003, M1): the cheapest models in LiteLLM 1.106.0's price map that
# support structured output, with thinking disabled (thinking tokens are billed as output).
# Gemini runs on the free tier, hence the client-side rpm cap.
llm:
  generator:
    { model: "gemini/gemini-3.1-flash-lite", temperature: 0.7, reasoning_effort: "none", rpm: 10 }
  judge: { model: "openai/gpt-5.4-nano", temperature: 0.0, reasoning_effort: "none" }
  agent:
    { model: "gemini/gemini-3.1-flash-lite", temperature: 0.0, reasoning_effort: "none", rpm: 10 }
  vision:
    { model: "gemini/gemini-3.1-flash-lite", temperature: 0.0, reasoning_effort: "none", rpm: 10 }

# Hard cap on cumulative spend per provider over the whole project (spend ledger in the LLM
# cache). OpenAI is pay-as-you-go with $2 left for M1-M8; Gemini is the free tier (its costs
# are LiteLLM list prices, recorded but not charged).
spend_limits_usd:
  openai: 2.0

# fastembed applies no query/passage prefixes; these follow each model card (M3).
# On the dev laptop CPU a 33M-param encoder takes ~0.6 s per 400-token chunk, so M3 compares
# two small models; nomic (137M) would take ~1 h per corpus embed.
embedding:
  default: "BAAI/bge-small-en-v1.5"
  candidates:
    ["BAAI/bge-small-en-v1.5", "snowflake/snowflake-arctic-embed-s", "BAAI/bge-base-en-v1.5"]
  prefixes:
    "BAAI/bge-small-en-v1.5":
      { query: "Represent this sentence for searching relevant passages: ", passage: "" }
    "BAAI/bge-base-en-v1.5":
      { query: "Represent this sentence for searching relevant passages: ", passage: "" }
    "snowflake/snowflake-arctic-embed-s":
      { query: "Represent this sentence for searching relevant passages: ", passage: "" }

reranker:
  default: "BAAI/bge-reranker-base"
  candidates: ["BAAI/bge-reranker-base", "cross-encoder/ms-marco-MiniLM-L-6-v2"]
