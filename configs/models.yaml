# Model names live here, never in code (CLAUDE.md). Names use LiteLLM's "<provider>/<model>".
# The judge must come from a different provider family than the generator to reduce
# self-preference bias (PROJECT_SPEC §2, §5.4); the loader enforces this.
# Budget-driven choice (ADR 0003, M1): the cheapest models in LiteLLM 1.106.0's price map that
# support structured output, with thinking disabled (thinking tokens are billed as output).
# Gemini runs on the free tier, hence the client-side rpm cap.
llm:
  generator:
    { model: "gemini/gemini-3.1-flash-lite", temperature: 0.7, reasoning_effort: "none", rpm: 10 }
  judge: { model: "openai/gpt-5.4-nano", temperature: 0.0, reasoning_effort: "none" }
  # M8: 3.1-flash-lite's daily free quota was used up again (2026-10-19), 2.5-flash-lite is
  # closed to new users, 3.5-flash-lite is shared with vision. The agent and all three answer
  # modes run on Gemma 4 26B-A4B via the Gemini API (free, tool calling) so they stay comparable.
  # Free tier: 16k input tokens/min for Gemma, ~3k tokens per agent call -> 4 calls/min.
  agent: { model: "gemini/gemma-4-26b-a4b-it", temperature: 0.0, rpm: 4 }
  # M7: 3.1-flash-lite's 500/day free quota was used up on 2026-10-18; vision moved to
  # 3.5-flash-lite (own per-model quota, also free tier).
  vision:
    { model: "gemini/gemini-3.5-flash-lite", temperature: 0.0, reasoning_effort: "none", rpm: 10 }
  # Query understanding (M5) on a local model (Ollama, RTX 3050): no per-day/per-minute quota
  # and no cost; the Gemini free tier caps requests per day per model (ADR 0005).
  query:
    {
      model: "ollama_chat/qwen2.5:3b-instruct",
      temperature: 0.0,
      api_base: "http://127.0.0.1:11434",
    }

# Hard cap on cumulative spend per provider over the whole project (spend ledger in the LLM
# cache). OpenAI is pay-as-you-go: $2 for M1-M8 at first; after M4 the owner reported about $1
# left, so the cap is the ledger at that point ($0.933) + $0.95. Gemini is the free tier (its
# costs are LiteLLM list prices, recorded but not charged); Ollama models cost nothing.
spend_limits_usd:
  openai: 1.88

# fastembed applies no query/passage prefixes; these follow each model card (M3).
# On the dev laptop CPU a 33M-param encoder takes ~0.6 s per 400-token chunk, so M3 compares
# two small models; nomic (137M) would take ~1 h per corpus embed.
embedding:
  default: "BAAI/bge-small-en-v1.5"
  candidates:
    ["BAAI/bge-small-en-v1.5", "snowflake/snowflake-arctic-embed-s", "BAAI/bge-base-en-v1.5"]
  prefixes:
    "BAAI/bge-small-en-v1.5":
      { query: "Represent this sentence for searching relevant passages: ", passage: "" }
    "BAAI/bge-base-en-v1.5":
      { query: "Represent this sentence for searching relevant passages: ", passage: "" }
    "snowflake/snowflake-arctic-embed-s":
      { query: "Represent this sentence for searching relevant passages: ", passage: "" }

reranker:
  default: "BAAI/bge-reranker-base"
  candidates: ["BAAI/bge-reranker-base", "cross-encoder/ms-marco-MiniLM-L-6-v2"]

# OCR (M7). RapidOCR ships only a Chinese recogniser, which drops spaces in English text; the
# English PP-OCRv3 recogniser comes from the RapidOCR model repo on the Hugging Face Hub.
ocr:
  rapidocr_rec: { repo: "SWHL/RapidOCR", file: "PP-OCRv3/en_PP-OCRv3_rec_infer.onnx" }

# Text-to-image retrieval (M7): CLIP ViT-B/32, both towers via fastembed (ONNX).
image_embedding:
  image: "Qdrant/clip-ViT-B-32-vision"
  text: "Qdrant/clip-ViT-B-32-text"
