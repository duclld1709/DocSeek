# Model names live here, never in code (CLAUDE.md). Names use LiteLLM's "<provider>/<model>".
# The judge must come from a different provider family than the generator to reduce
# self-preference bias (PROJECT_SPEC §2, §5.4); the loader enforces this.
# Chosen from LiteLLM 1.105.1's model price map on 2026-10-18; re-verify when keys are used (M1).
llm:
  generator: { model: "gemini/gemini-3.8-flash", temperature: 0.7 }
  judge: { model: "openai/gpt-5.4-mini", temperature: 0.0 }
  agent: { model: "gemini/gemini-3.8-flash", temperature: 0.0 }
  vision: { model: "gemini/gemini-3.8-flash", temperature: 0.0 }

embedding:
  default: "BAAI/bge-small-en-v1.5"
  candidates: ["BAAI/bge-small-en-v1.5", "BAAI/bge-base-en-v1.5", "intfloat/e5-small-v2"]

reranker:
  default: "BAAI/bge-reranker-base"
  candidates: ["BAAI/bge-reranker-base", "cross-encoder/ms-marco-MiniLM-L-6-v2"]
