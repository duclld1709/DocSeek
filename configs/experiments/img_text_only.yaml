# M7 image queries, baseline: the M5 default (fresh_ctx) over text chunks only (no image info).
name: img_text_only
golden: data/golden/golden_multimodal.jsonl
qtypes: [image]
chunks_file: chunks_section_ctx.jsonl
retriever:
  type: freshness
  beta: 0.0
  tau_days: 180
  deprecated_penalty: 0.0
  superseded_penalty: 0.5
  depth: 50
  inner:
    type: hybrid
    method: weighted
    norm: minmax
    alpha: 0.3
    depth: 50
    children:
      bm25: { type: bm25, k1: 1.5, b: 0.5, fields: { title: 2.0, section_path: 0.5, body: 1.0, code: 0.5 } }
      dense: { type: dense, model: BAAI/bge-small-en-v1.5 }
