# M5: hybrid over section_ctx chunks (path header in the embedded text); alpha re-tuned
# on dev (0.3 > 0.4 > 0.2) because the header makes the dense side stronger.
name: hybrid_ctx
retriever:
  type: hybrid
  method: weighted
  norm: minmax
  alpha: 0.3
  depth: 50
  children:
    bm25:
      type: bm25
      k1: 1.5
      b: 0.5
      fields:
        title: 2.0
        section_path: 0.5
        body: 1.0
        code: 0.5
    dense:
      type: dense
      model: BAAI/bge-small-en-v1.5
chunks_file: chunks_section_ctx.jsonl
