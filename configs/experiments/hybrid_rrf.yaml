# M4: own RRF over bm25f + dense bge-small, each to depth 50.
name: hybrid_rrf
retriever:
  type: hybrid
  method: rrf
  rrf_k: 60
  depth: 50
  children:
    bm25:
      type: bm25
      k1: 1.5
      b: 0.5
      fields: { title: 2.0, section_path: 0.5, body: 1.0, code: 0.5 }
    dense: { type: dense, model: BAAI/bge-small-en-v1.5 }
