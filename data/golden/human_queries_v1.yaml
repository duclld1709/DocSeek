# Hand-written golden queries. Target: ~30, spread over qtypes.
#
# AUTHORSHIP: every query below was written by the coding assistant (Claude, model
# claude-opus-5-5) on 2026-10-18 at the project owner's request, NOT by a person. Each entry
# carries `annotator: claude-opus-5-5`, and build-golden gives them origin "claude".
# They aim at what the synthetic generator under-produces: short, vague or misspelled
# queries whose words differ from the docs (low lexical overlap). Each relevant section was
# read in data/processed/sections.jsonl before labelling.
#
# Find section ids with:  uv run docseek eval find-sections "background tasks"
# Grades: 2 = answers directly, 1 = related/partial. Relevant sections must be readable by
# the principal (anonymous: public; engineer: + eng-internal; security: + security-team).
# unanswerable / permission-denied rows have `relevant: {}`.
# Then: uv run docseek eval build-golden
