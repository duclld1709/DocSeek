[project]
name = "docseek"
version = "0.1.0"
description = "Measurable agentic retrieval over technical documentation"
authors = [
    { name = "DucLLD1709", email = "lailedinhduc@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastembed>=0.9.0",
    "litellm>=1.106.0",
    "neo4j>=6.4.1",
    "numpy>=2.5.4",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.19.1",
    "rich>=15.0.0",
    "structlog>=26.1.0",
    "tenacity>=9",
    "tokenizers>=0.23.3",
    "typer>=0.27.3",
]

[project.scripts]
docseek = "docseek.cli:app"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Fixture corpora mimic upstream files verbatim; never lint or reformat them.
extend-exclude = ["tests/fixtures"]

[tool.ruff.format]
# Ruff formats code blocks inside Markdown; spec and docs must stay as written.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "T20"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
warn_unreachable = true
pretty = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-m", "not integration and not e2e and not network"]
markers = [
    "integration: needs docker services (Qdrant, Neo4j)",
    "network: downloads public model files (Hugging Face); no keys needed",
    "e2e: needs real API keys; never run in CI",
]

[tool.coverage.run]
source = ["docseek"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[dependency-groups]
dev = [
    "hypothesis>=6.170.1",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ranx>=0.3.21",
    "ruff>=0.17.1",
    "types-pyyaml>=6.0.12.20260906",
]
