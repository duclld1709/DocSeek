# Local services for DocSeek. `docker compose up -d`, then `uv run docseek doctor`.
# Ports bind to 127.0.0.1 only. NEO4J_PASSWORD is read from .env (min. 8 characters).
name: docseek

services:
  qdrant:
    image: qdrant/qdrant:v1.19.2
    ports:
      - "127.0.0.1:6333:6333" # REST
      - "127.0.0.1:6334:6334" # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # The image ships without curl/wget, so probe /readyz over bash's /dev/tcp.
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 &&
          printf "GET /readyz HTTP/1.0\r\n\r\n" >&3 &&
          head -n1 <&3 | grep -q " 200"'
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 12
    restart: unless-stopped

  neo4j:
    image: neo4j:5.26-community
    ports:
      - "127.0.0.1:7474:7474" # HTTP browser
      - "127.0.0.1:7687:7687" # Bolt
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-change-me}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1g
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      # Checks Bolt end to end with the configured credentials.
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 12
    restart: unless-stopped

  # API + UI. Default = quick demo on the mini fixture corpus (no model download, < 2 min).
  # Full corpus: build the index on the host (see README), then
  #   DOCSEEK_SERVICE_CONFIG=configs/service.yaml docker compose up -d
  api:
    build: .
    command: >-
      sh -c "docseek demo build --out data/demo &&
      uvicorn docseek.api.app:app --host 0.0.0.0 --port 8000"
    environment:
      DOCSEEK_SERVICE_CONFIG: ${DOCSEEK_SERVICE_CONFIG:-configs/service_demo.yaml}
      QDRANT_URL: http://qdrant:6333
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-change-me}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DOCSEEK_LLM_CACHE: /app/.cache/llm.sqlite  # shared with the host: one cache + spend ledger
    volumes:
      - ./data:/app/data
      - ./.cache:/app/.cache
      - ./experiments:/app/experiments:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 10s
      timeout: 10s
      start_period: 60s
      retries: 18
    restart: unless-stopped

  ui:
    build: .
    command: >-
      streamlit run src/docseek/ui/app.py --server.address 0.0.0.0 --server.port 8501
      --server.headless true --browser.gatherUsageStats false
    environment:
      DOCSEEK_API_URL: http://api:8000
      DOCSEEK_EXPERIMENTS_DIR: /app/experiments
    volumes:
      - ./data:/app/data:ro
      - ./experiments:/app/experiments:ro
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  qdrant_storage:
  neo4j_data:
  neo4j_logs:
