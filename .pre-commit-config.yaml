# Install once with: uv run pre-commit install
repos:
  - repo: local
    hooks:
      - id: forbid-env-files
        name: forbid committing .env files (use .env.example)
        entry: ".env files hold secrets and must never be committed; use .env.example"
        language: fail
        files: '(^|/)\.env(\..+)?$'
        exclude: '(^|/)\.env\.example$'

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=1000"]
        # Pooled judge labels keep the judge's reason per pair for auditing (~1.4 MB).
        exclude: ^data/golden/pool_judgments_v[0-9]+[.]jsonl$
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict)
        entry: uv run mypy src
        language: system
        types: [python]
        pass_filenames: false
